name: sync-docker-images

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "*.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "*.md" ]
  workflow_dispatch:  # Allows you to run this workflow manually from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  # required to set AUTH_FILE_CONTENT secret in GitHub secrets for Actions
  AUTH_FILE_CONTENT: ${{ secrets.AUTH_FILE_CONTENT }}


jobs:
  ## Sync all image definition files in `task-sync-docker-images/`
  job-sync-images:
    # needs: []
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image_file:
          - images-app.yaml
          - images-containers.yaml
          - images-cuda.yaml
          - images-db.yaml
    steps:
      - uses: actions/checkout@v7
      - run: |
          printf '%s' "$AUTH_FILE_CONTENT" > .github/workflows/auth.json && ls -alh ./.github/workflows
          printenv | grep -v 'PATH' > /tmp/docker.env
          docker run --rm --env-file /tmp/docker.env \
            -e XDG_RUNTIME_DIR="" \
            -v $(pwd):/tmp -w /tmp\
            labnow/docker-kit image-syncer --proc=8 --retries=2 \
              --auth /tmp/.github/workflows/auth.json \
              --images /tmp/task-sync-docker-images/${{ matrix.image_file }}
